name: ZNY Public Site Quality Checks

on:
  push:
    branches:
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: PHP syntax check
        run: |
          find app bootstrap config database routes scripts -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: SEO and contact regression assertions
        run: php scripts/zny_public_patch_checks.php
