name: Seal CMS composer.lock for Beget PHP 8.2

on:
  push:
    branches:
      - 'spike/cms-laravel12-filament4-20261119'
    paths:
      - '.github/workflows/cms-seal-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seal-lock:
    if: github.ref == 'refs/heads/spike/cms-laravel12-filament4-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exactly the trusted CMS branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: PHP 8.2 for the Beget release target
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, fileinfo, gd, zip
          tools: composer:v2
      - name: Verify pinned PHP platform requirement
        run: |
          php -r '$c=json_decode(file_get_contents("composer.json"),true,512,JSON_THROW_ON_ERROR);if(($c["config"]["platform"]["php"]??"")!=="8.2.35"){exit(1);}'
      - name: Resolve exact dependency versions
        run: composer update --no-interaction --prefer-dist --no-progress
      - name: Independent Composer audit
        run: |
          composer audit --locked --no-dev --no-interaction
          composer check-platform-reqs --no-dev --no-interaction
      - name: Commit only the reproducible lockfile, never app code
        run: |
          set -euo pipefail
          test -s composer.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- composer.lock
          if git diff --cached --quiet; then
            echo "composer.lock already identical"
            exit 0
          fi
          git diff --cached --name-only | grep -qx 'composer.lock'
          git commit -m 'build(cms): seal audited PHP 8.2 Composer dependency lock'
          git push origin "HEAD:refs/heads/spike/cms-laravel12-filament4-20261119"
