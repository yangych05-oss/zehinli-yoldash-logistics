name: CMS Laravel integration smoke

on:
  pull_request:
    paths:
      - 'app/**'
      - 'database/**'
      - 'resources/views/**'
      - 'tests/**'
      - 'composer.json'
      - '.github/workflows/cms-laravel-integration.yml'
  push:
    branches:
      - 'feature/cms-text-media-stage-20261119'
      - 'spike/cms-laravel12-filament4-20261119'

permissions:
  contents: read

jobs:
  cms-sqlite-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: https://example.invalid
      DB_CONNECTION: sqlite
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: public
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
      - name: PHP 8.3 and SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, sqlite3, pdo_sqlite, fileinfo, gd, zip
          tools: composer:v2
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Node 22 for audited Vite production assets
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Vite/Tailwind assets for real public Blade routes
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s public/build/manifest.json
      - name: Resolve and install project dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Composer security audit (production dependencies)
        run: composer audit --locked --no-dev --no-interaction
      - name: Save resolved lock file for reproducibility review
        uses: actions/upload-artifact@v4
        with:
          name: cms-composer-lock
          path: composer.lock
          retention-days: 7
      - name: Prepare isolated application and empty SQLite database
        run: |
          cp .env.example .env
          touch database/testing.sqlite
          echo "DB_DATABASE=$GITHUB_WORKSPACE/database/testing.sqlite" >> "$GITHUB_ENV"
          php artisan key:generate --no-interaction
      - name: Migrate disposable CMS schema
        run: php artisan migrate --force --no-interaction
      - name: Load Filament admin routes
        run: php artisan route:list --path=admin
      - name: Test role isolation, drafts, publishing and media replacement
        run: php tests/cms-laravel-smoke.php
      - name: Exercise Filament pages and uploads inside Laravel PHPUnit lifecycle
        run: vendor/bin/phpunit -c phpunit.cms.xml --testdox
